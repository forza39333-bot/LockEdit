name: Build LockEdit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip LockEdit_Android_Beta_CloudBuild.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/LockEdit_Android_Beta assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockEdit-debug-apk
          path: extracted/LockEdit_Android_Beta/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
