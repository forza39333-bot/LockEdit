name: Build LockEdit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip LockEdit_Android_Beta_CloudBuild.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/LockEdit_Android_Beta assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LockEdit-debug-apk
          path: extracted/LockEdit_Android_Beta/app/build/outputs/apk/debug/*.apk
